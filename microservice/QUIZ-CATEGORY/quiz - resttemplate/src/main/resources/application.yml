spring:
  data:
    mongodb:
      uri: "mongodb://localhost:27017/test"
  application:
    name: quiz
  config:
    import: configserver:http://localhost:9094
  cloud:
    config:
      profile: default
  rabbitmq:
    host: localhost
    :port: 5672
    :username: guest
    :password: guest

server:
  port: 9092
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/


logging:
  level:
    org.springframework.data.mongodb: TRACE
